<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyJob · Connexion</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <form id="form-login" class="card login-card">
    <h1>My<span>Job</span></h1>
    <label>Identifiant<input name="username" autocomplete="username" required autofocus></label>
    <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
    <p id="login-erreur" class="erreur" hidden></p>
    <button class="btn primary" type="submit">Se connecter</button>
  </form>
  <script src="js/login.js"></script>
</body>
</html>
